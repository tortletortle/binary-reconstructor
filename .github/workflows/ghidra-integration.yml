name: Real Ghidra integration

on:
  push:
    branches: [main]
    paths:
      - "ghidra_*.py"
      - "test_ghidra_*.py"
      - "ghidra_scripts/**"
      - "tests/ghidra/**"
      - ".github/workflows/ghidra-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghidra-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ghidra-12-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install native verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils libz3-4 unzip

      - name: Download official Ghidra 12.2 release
        run: |
          curl --fail --location --retry 3 \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip \
            --output "${{ runner.temp }}/ghidra.zip"
          mkdir -p "${{ runner.temp }}/ghidra"
          unzip -q "${{ runner.temp }}/ghidra.zip" -d "${{ runner.temp }}/ghidra"
          echo "GHIDRA_INSTALL_DIR=$(find "${{ runner.temp }}/ghidra" -mindepth 1 -maxdepth 1 -type d | head -n 1)" >> "$GITHUB_ENV"

      - name: Confirm runtime
        run: |
          java -version
          python --version
          test -x "${GHIDRA_INSTALL_DIR}/support/analyzeHeadless"
          test -f "${GHIDRA_INSTALL_DIR}/Ghidra/application.properties"
          echo "Ghidra distribution located at: ${GHIDRA_INSTALL_DIR}"

      - name: Build trusted ELF fixtures
        run: |
          mkdir -p build
          gcc -O1 -fno-inline -fno-stack-protector -shared -fPIC \
            tests/ghidra/mul_add.c tests/ghidra/branch.c -o build/libchrono_fixture.so
          file build/libchrono_fixture.so
          nm -D build/libchrono_fixture.so | grep -E ' (mul_add|branch_transform|branch_join)$'

      - name: Run complete regression suite
        run: python -m unittest discover -v

      - name: Run real Ghidra export and formal verification
        env:
          GHIDRA_INSTALL_DIR: ${{ runner.temp }}/ghidra/ghidra_12.2_PUBLIC
        run: |
          python ghidra_pipeline.py build/libchrono_fixture.so mul_add --trusted \
            --timeout 180 --decompile-timeout 60 --random-replay 4096 \
            | tee build/real-ghidra-mul-add-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("build/real-ghidra-mul-add-result.json").read_text())
          print(json.dumps(result, indent=2))
          assert result["status"] == "DIRECT_VERIFIED", result
          assert result["verification"]["formal"]["status"] == "UNSAT", result
          assert result["verification"]["native_replay"] >= 4096, result
          PY

      - name: Export real branch CFG fixtures for inspection
        env:
          GHIDRA_INSTALL_DIR: ${{ runner.temp }}/ghidra/ghidra_12.2_PUBLIC
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from ghidra_adapter import export
          from ghidra_pcode import lower_acyclic_uint32
          from ghidra_pipeline import verify_lowered

          binary = "build/libchrono_fixture.so"
          for name in ("branch_transform", "branch_join"):
              result = export(binary, name, timeout=180, decompile_timeout=60)
              assert result["status"] == "RAW_PSEUDOCODE", result
              analysis = result["analysis"]
              operations = analysis["operation_counts"]
              assert analysis["block_count"] == 3, analysis
              assert analysis["edge_count"] == 3, analysis
              assert operations.get("CBRANCH", 0) >= 1, operations
              assert operations.get("MULTIEQUAL", 0) >= 1, operations

              lowered = lower_acyclic_uint32(analysis)
              checked = verify_lowered(binary, name, lowered, random_replay=4096)
              summary = {
                  "function": name,
                  "block_count": analysis["block_count"],
                  "edge_count": analysis["edge_count"],
                  "operation_counts": operations,
                  "decompiler_c_source": analysis["decompiler_c_source"],
                  "expression": lowered["expression"],
                  "cfg_paths": lowered["cfg_paths"],
                  "verification": checked,
              }
              print(json.dumps(summary, indent=2))
              assert checked["status"] == "DIRECT_VERIFIED", summary
              assert checked["formal"]["status"] == "UNSAT", summary
              assert checked["native_replay"] >= 4096, summary
              Path(f"build/{name}-ghidra-export.json").write_text(
                  json.dumps(result["pcode_export"], indent=2), encoding="utf-8"
              )
              Path(f"build/{name}-verification.json").write_text(
                  json.dumps(summary, indent=2), encoding="utf-8"
              )
          PY

      - name: Upload real Ghidra evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-ghidra-v0.19-cfg-verification
          path: |
            build/real-ghidra-mul-add-result.json
            build/branch_transform-ghidra-export.json
            build/branch_join-ghidra-export.json
            build/branch_transform-verification.json
            build/branch_join-verification.json
          if-no-files-found: ignore
          retention-days: 30

name: Ghidra 12.2 real integration

on:
  push:
    branches: [main, v0.18-real-ghidra-ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ghidra-headless-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 25 (required by Ghidra 12.2)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install native verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc binutils libz3-4 libz3-dev unzip curl file
          java -version
          python --version
          gcc --version | head -n 1
          objdump --version | head -n 1
          dpkg-query -W -f='libz3-4=${Version}\\n' libz3-4
          ldconfig -p | grep 'libz3.so'

      - name: Download and verify official Ghidra 12.2 release
        env:
          GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
          GHIDRA_SHA256: 2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67
        run: |
          curl --fail --location --retry 3 --retry-delay 3 "$GHIDRA_URL" -o "$RUNNER_TEMP/ghidra-12.2.zip"
          echo "$GHIDRA_SHA256  $RUNNER_TEMP/ghidra-12.2.zip" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/ghidra-install"
          unzip -q "$RUNNER_TEMP/ghidra-12.2.zip" -d "$RUNNER_TEMP/ghidra-install"
          GHIDRA_DIR="$(find "$RUNNER_TEMP/ghidra-install" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' -print -quit)"
          test -n "$GHIDRA_DIR"
          test -x "$GHIDRA_DIR/support/analyzeHeadless"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"

      - name: Run existing regression suite
        id: regression
        continue-on-error: true
        run: python -m unittest discover -v

      - name: Build trusted real-binary fixture
        if: always()
        run: |
          mkdir -p build
          gcc -g -O2 -fno-stack-protector -fPIC -shared -Wl,-z,relro,-z,now \
            tests/fixtures/ghidra_mul_add.c -o build/ghidra_fixture.so
          file build/ghidra_fixture.so
          nm -D --defined-only build/ghidra_fixture.so | grep chrono_mul_add

      - name: Run real Ghidra export, P-code lowering, SMT and native replay
        if: always()
        run: |
          python scripts/ghidra_smoke.py build/ghidra_fixture.so chrono_mul_add \
            --output-dir build/ghidra-smoke --timeout 300 --decompile-timeout 60 --random-replay 4096

      - name: Upload real Ghidra evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-ghidra-12.2-evidence
          path: |
            build/ghidra_fixture.so
            build/ghidra-smoke/**
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce regression-suite result
        if: always()
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        run: |
          if [ "$REGRESSION_OUTCOME" != "success" ]; then
            echo "Full regression suite failed; inspect the diagnostic assertion output above."
            exit 1
          fi
